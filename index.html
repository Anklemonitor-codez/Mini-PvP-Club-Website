<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini PvP Club</title>
</head>
<body>
    <div id="player-template" class="player" style="display:none;">
        <span class="name"></span>
        <span class="rank"></span>
    </div>

    <div id="leaderboard"></div>
</body>

<script>
    fetch("players.json")
        .then(res => res.json())
        .then(data => {

            const container = document.getElementById("leaderboard");
            const template = document.getElementById("player-template");

            data.Players.forEach(player => {

                // clone template
                const clone = template.cloneNode(true);
                clone.style.display = "block"; // show it
                clone.removeAttribute("id"); // avoid duplicate IDs

                // fill data
                clone.querySelector(".name").textContent = player.Username;
                clone.querySelector(".rank").textContent = player.Rank;

                // add to page
                container.appendChild(clone);
            });

        });
</script>
</html>
