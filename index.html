<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini PvP Club</title>
</head>
<body>
    <h2>JSON</h2>
    <pre id="list"></pre>
</body>

<script>
    fetch("players.json")
        .then(res => res.json())
        .then(data => {

            document.getElementById("list").innerHTML =
                data.Players.map(p =>
                    `<li>${p.Username} - ${p.Rank}</li>`
                ).join("");

        });
</script>
</html>
